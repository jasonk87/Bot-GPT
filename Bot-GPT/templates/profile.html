<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-800 text-gray-200">
    <div class="container mx-auto p-4">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-3xl font-bold">User Profile</h1>
            <a href="/" class="text-blue-400 hover:text-blue-300">&larr; Back to Chat</a>
        </div>
        <div class="bg-gray-700 p-6 rounded-lg mb-6">
            <h2 class="text-xl font-bold mb-4">User Information</h2>
            <p class="text-lg">Username: <span class="font-mono">{{ user.username }}</span></p>
        </div>
        <div class="bg-gray-700 p-6 rounded-lg mb-6">
            <h2 class="text-xl font-bold mb-4">Usage Statistics</h2>
            <p class="text-gray-400">Usage statistics will be available here in a future update.</p>
        </div>
        <div class="bg-gray-700 p-6 rounded-lg">
            <h2 class="text-xl font-bold mb-4">API Key Management</h2>
            <p class="text-gray-400">API key management will be available here in a future update.</p>
        </div>
    </div>
</body>
</html>
