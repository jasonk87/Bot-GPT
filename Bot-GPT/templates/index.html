<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Ollama Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.15/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .scrollable-content::-webkit-scrollbar { width: 6px; }
        .scrollable-content::-webkit-scrollbar-track { background: #171717; }
        .scrollable-content::-webkit-scrollbar-thumb { background-color: #4b5563; border-radius: 20px; }
        .item-hover:hover .delete-btn { opacity: 1; }
        .delete-btn { opacity: 0; transition: opacity 0.2s; }
        .prose { word-break: break-word; }
        .prose table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; margin-bottom: 1.5rem; }
        .prose th, .prose td { border: 1px solid #4b5563; padding: 8px; }
        .prose th { background-color: #374151; }
        .prose pre { background-color: #111827; padding: 0; border-radius: 0.5rem; position: relative; margin-top: 1.5rem; margin-bottom: 1.5rem; }
        .prose pre code { display: block; padding: 1rem; }
        .side-panel-tab.active { border-color: #3b82f6; color: #eff6ff; }
        .conversation-item.active { background-color: #2563eb; }
        .copy-btn { position: absolute; top: 0.5rem; right: 0.5rem; background-color: #374151; color: white; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; opacity: 0; transition: opacity 0.2s; }
        .prose pre:hover .copy-btn { opacity: 1; }
        
        .agent-status {
            font-style: italic;
            color: #9ca3af;
            font-size: 0.875rem;
            margin-bottom: 0.75rem;
        }

        .tool-activity {
            border: 1px solid #4a5568;
            border-radius: 0.5rem;
            margin-top: 1rem;
            background-color: #2d3748;
        }
        .tool-activity-header {
            display: flex;
            align-items: center;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #4a5568;
            font-weight: 600;
        }
        .tool-activity-body {
            padding: 1rem;
            font-family: monospace;
            font-size: 0.875rem;
        }
        .tool-activity-body pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .thinking-process-container {
            background-color: #2d3748;
            border: 1px solid #4a5568;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
        .thinking-header {
            display: flex;
            align-items: center;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #4a5568;
            font-weight: 600;
            cursor: pointer;
        }
        .thinking-content {
            padding: 1rem;
            font-size: 0.875rem;
            max-height: 200px;
            overflow-y: auto;
        }
        .CodeMirror {
            height: 100%;
            font-family: monospace;
        }
        .plan-step-container {
            background-color: #2d3748;
            border: 1px solid #4a5568;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
        .plan-step-header {
            display: flex;
            align-items: center;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #4a5568;
            font-weight: 600;
        }
        .plan-step-content {
            padding: 1rem;
            font-size: 0.875rem;
        }
        .tool-activity-body .status-running { color: #facc15; }
        .tool-activity-body .status-success { color: #4ade80; }
        .tool-activity-body .status-error { color: #f87171; }

        .user-bubble {
            background-color: #1e3a8a; /* A shade of blue */
            padding: 0.75rem;
            border-radius: 0.75rem;
        }
        .bot-bubble {
            background-color: #374151; /* A darker grey */
            padding: 0.75rem;
            border-radius: 0.75rem;
        }
        #drop-zone {
            border: 2px dashed #4b5563;
            border-radius: 0.5rem;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #drop-zone.drag-over {
            background-color: #374151;
        }
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }

        /* Animation for chat bubbles */
        @keyframes slideInFade {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .newly-added {
            animation: slideInFade 0.3s ease-out forwards;
        }

        /* Thinking Indicator Animation */
        .thinking-indicator {
            display: flex;
            align-items: center;
            padding: 0.5rem;
        }
        .thinking-indicator span {
            animation: pulse 1.4s infinite ease-in-out both;
            display: inline-block;
            margin: 0 2px;
            width: 8px;
            height: 8px;
            background-color: #9ca3af;
            border-radius: 50%;
        }
        .thinking-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-indicator span:nth-child(2) { animation-delay: -0.16s; }
        .thinking-indicator span:nth-child(3) { animation-delay: 0; }
        
        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            bottom: 1.25rem;
            right: 1.25rem;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .toast {
            background-color: #2d3748;
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            transition: all 0.3s ease-in-out;
            opacity: 0;
            transform: translateX(100%);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .toast.error {
            background-color: #c53030;
        }

        /* Modal Transitions */
        .modal {
            transition: opacity 0.3s ease-in-out;
        }

        @keyframes pulse-bg {
            0% { background-color: #2563eb; } /* blue-600 */
            50% { background-color: #3b82f6; } /* blue-500 */
            100% { background-color: #2563eb; } /* blue-600 */
        }
        .pulse-once {
            animation: pulse-bg 1s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-800 text-gray-200">

    <!-- Auth Screen -->
    <div id="auth-screen" class="flex items-center justify-center h-screen">
        <div class="w-full max-w-md">
            <div class="bg-gray-700 shadow-md rounded-lg px-8 pt-6 pb-8 mb-4">
                <div id="auth-tabs" class="flex mb-4 border-b border-gray-600">
                    <button class="auth-tab-btn flex-1 py-2 text-white border-b-2 border-blue-500" data-tab="login">Login</button>
                    <button class="auth-tab-btn flex-1 py-2 text-gray-400" data-tab="register">Register</button>
                </div>
                <div id="auth-error" class="text-red-400 text-center mb-4 h-6"></div>
                <form id="login-form">
                    <div class="mb-4">
                        <label class="block text-gray-300 text-sm font-bold mb-2" for="login-username">Username</label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 bg-gray-600 text-white leading-tight focus:outline-none focus:shadow-outline" id="login-username" type="text" required>
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-300 text-sm font-bold mb-2" for="login-password">Password</label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 bg-gray-600 text-white mb-3 leading-tight focus:outline-none focus:shadow-outline" id="login-password" type="password" required>
                    </div>
                    <div class="flex items-center justify-between">
                        <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">Sign In</button>
                    </div>
                </form>
                <form id="register-form" class="hidden">
                    <div class="mb-4">
                        <label class="block text-gray-300 text-sm font-bold mb-2" for="register-username">Username</label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 bg-gray-600 text-white leading-tight focus:outline-none focus:shadow-outline" id="register-username" type="text" required>
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-300 text-sm font-bold mb-2" for="register-password">Password</label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 bg-gray-600 text-white mb-3 leading-tight focus:outline-none focus:shadow-outline" id="register-password" type="password" required>
                    </div>
                    <div class="flex items-center justify-between">
                        <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">Register</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="main-app" class="hidden h-screen flex">
        <!-- Side Panel -->
        <aside id="side-panel" class="bg-gray-900 w-64 flex-shrink-0 flex flex-col transition-transform duration-300 ease-in-out absolute inset-y-0 left-0 z-30 transform -translate-x-full sm:relative sm:translate-x-0">
            <div class="p-2 flex-shrink-0">
                <button id="new-chat-btn" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded">New Chat</button>
            </div>
            <div class="flex border-b border-t border-gray-700 flex-shrink-0">
                <button id="chats-tab-btn" class="side-panel-tab flex-1 p-2 text-center font-semibold border-b-2 active">Chats</button>
                <button id="files-tab-btn" class="side-panel-tab flex-1 p-2 text-center font-semibold border-b-2 border-transparent">Files</button>
            </div>
            <div id="conversations-panel" class="flex flex-col flex-1 overflow-hidden">
                <div id="conversation-list" class="scrollable-content flex-1 p-2 overflow-y-auto"></div>
            </div>
            <div id="files-panel" class="hidden flex-col flex-1 overflow-hidden">
                 <div id="file-explorer" class="scrollable-content flex-1 p-4 overflow-y-auto"></div>
            </div>
            <div class="p-2 border-t border-gray-700 flex items-center justify-between">
                <span id="welcome-user" class="text-sm truncate"></span>
                <div>
                    <button id="settings-btn" class="p-2 text-gray-400 hover:text-white" title="Settings">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0 3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </button>
                    <button id="logout-btn" class="p-2 text-gray-400 hover:text-white" title="Logout">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </button>
                </div>
            </div>
        </aside>
        
        <!-- Overlay for mobile -->
        <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-20 hidden sm:hidden"></div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col relative bg-gray-800 overflow-hidden">
            <header class="bg-gray-800 border-b border-gray-700 p-4 flex items-center flex-shrink-0">
                <button id="menu-btn" class="sm:hidden mr-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex-1 text-center text-xs text-gray-400">
                    Model: <span id="current-model-display" class="font-mono text-white"></span>
                </div>
            </header>

            <!-- Content Wrapper for Chat and Canvas -->
            <div id="content-wrapper" class="flex-1 flex flex-col md:flex-row overflow-hidden">
                <!-- Chat Column -->
                <div id="chat-column" class="flex-1 flex flex-col h-full w-full transition-all duration-300">
                                <div id="chat-container" class="flex-1 p-4 overflow-y-auto space-y-4 scroll-smooth">
                <!-- Welcome Message -->
                <div id="welcome-message" class="text-center text-gray-400">
                    <h1 class="text-3xl font-bold">Bot-GPT</h1>
                    <p>Your personal AI assistant. Start a new chat to begin.</p>
                </div>
                <!-- Chat messages will be appended here -->
            </div>

            <!-- Agent Status Bar -->
            <div id="agent-status-bar"></div>

            <!-- Chat Input -->
            <div id="chat-input-container" class="p-4 bg-gray-800/50 border-t border-gray-700">
                <div class="bg-gray-700 rounded-lg flex items-center p-2">
                    <button id="upload-btn" class="p-2 text-gray-400 hover:text-white" title="Upload Files">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    </button>
                    <button id="canvas-toggle-btn" class="p-2 text-gray-400 hover:text-white" title="Toggle Canvas View">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l-4 4-4-4 4-4"></path></svg>
                    </button>

                    <textarea id="chat-input" class="flex-1 w-full bg-transparent text-white p-2 resize-none focus:outline-none" rows="1" placeholder="Type your message..."></textarea>
                    
                    <button id="send-button" class="ml-2 p-2 rounded-full bg-blue-600 hover:bg-blue-700 text-white disabled:bg-gray-500 disabled:cursor-not-allowed">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"></path></svg>
                    </button>
                </div>
            </div>
                </div>

                <!-- Canvas Column -->
                <div id="canvas-column" class="hidden flex-col h-full w-full md:w-1/2 border-l border-gray-700 bg-gray-800 transition-all duration-300">
                    <div class="flex justify-between items-center p-4 border-b border-gray-700 flex-shrink-0">
                        <h3 id="file-viewer-filename" class="text-lg font-bold truncate"></h3>
                        <div>
                            <button id="copy-file-btn" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-1 px-3 rounded-md text-sm mr-2">Copy</button>
                            <button id="save-file-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-1 px-3 rounded-md text-sm">Save</button>
                            <button id="close-viewer-btn" class="text-gray-400 hover:text-white font-bold ml-4 text-2xl leading-none">&times;</button>
                        </div>
                    </div>
                    <div id="file-viewer" class="flex-1 overflow-hidden"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="delete-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 modal">
        <div class="bg-gray-800 rounded-lg p-6 shadow-xl">
            <h3 class="text-lg font-bold mb-4">Confirm Deletion</h3>
            <p id="delete-modal-text" class="mb-6"></p>
            <div class="flex justify-end space-x-4">
                <button id="cancel-delete-btn" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded">Cancel</button>
                <button id="confirm-delete-btn" class="bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-4 rounded">Delete</button>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="share-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 modal">
        <div class="bg-gray-800 rounded-lg p-6 shadow-xl w-full max-w-md">
            <h3 class="text-lg font-bold mb-4">Share Conversation</h3>
            <div id="share-user-list" class="scrollable-content max-h-60 overflow-y-auto"></div>
            <div class="flex justify-end mt-6">
                <button id="cancel-share-btn" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="upload-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 modal">
        <div class="bg-gray-800 rounded-lg p-6 shadow-xl w-full max-w-lg">
            <h3 class="text-lg font-bold mb-4">Upload Files and Folders</h3>
            <form id="upload-form">
                <div class="mb-4">
                    <label for="upload-prompt" class="block text-gray-300 text-sm font-bold mb-2">Prompt (optional)</label>
                    <textarea id="upload-prompt" rows="3" class="shadow appearance-none border rounded w-full py-2 px-3 bg-gray-600 text-white leading-tight focus:outline-none focus:shadow-outline" placeholder="Give the AI instructions for these files..."></textarea>
                </div>
                <div class="mb-6">
                    <div id="drop-zone">
                        <p>Drag & drop files or folders here, or click to select.</p>
                        <input type="file" id="file-input" class="hidden" multiple>
                    </div>
                    <div id="file-list" class="mt-2 text-sm text-gray-400"></div>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="cancel-upload-btn" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded">Cancel</button>
                    <button type="submit" id="confirm-upload-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded">Upload and Send</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 modal">
        <div class="bg-gray-800 rounded-lg p-6 shadow-xl w-full max-w-lg">
            <h3 class="text-lg font-bold mb-4">Agent Settings</h3>
            <form id="settings-form">
                <div class="mb-4">
                    <label for="model-select" class="block text-gray-300 text-sm font-bold mb-2">Default Model</label>
                    <select id="model-select" class="shadow appearance-none border rounded w-full py-2 px-3 bg-gray-600 text-white leading-tight focus:outline-none focus:shadow-outline"></select>
                </div>
                <div class="mb-6">
                    <label for="persona-select" class="block text-gray-300 text-sm font-bold mb-2">Personality</label>
                    <select id="persona-select" class="shadow appearance-none border rounded w-full py-2 px-3 bg-gray-600 text-white leading-tight focus:outline-none focus:shadow-outline"></select>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="cancel-settings-btn" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded">Cancel</button>
                    <button type="submit" id="save-settings-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded">Save Settings</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2"></div>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
