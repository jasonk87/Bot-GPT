<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Ollama Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .scrollable-content::-webkit-scrollbar { width: 6px; }
        .scrollable-content::-webkit-scrollbar-track { background: #171717; }
        .scrollable-content::-webkit-scrollbar-thumb { background-color: #4b5563; border-radius: 20px; }
        .item-hover:hover .delete-btn { opacity: 1; }
        .delete-btn { opacity: 0; transition: opacity 0.2s; }
        .prose { word-break: break-word; }
        .prose table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; margin-bottom: 1.5rem; }
        .prose th, .prose td { border: 1px solid #4b5563; padding: 8px; }
        .prose th { background-color: #374151; }
        .prose pre { background-color: #111827; padding: 0; border-radius: 0.5rem; position: relative; margin-top: 1.5rem; margin-bottom: 1.5rem; }
        .prose pre code { display: block; padding: 1rem; }
        .side-panel-tab.active { border-color: #3b82f6; color: #eff6ff; }
        .conversation-item.active { background-color: #2563eb; }
        .copy-btn { position: absolute; top: 0.5rem; right: 0.5rem; background-color: #374151; color: white; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; opacity: 0; transition: opacity 0.2s; }
        .prose pre:hover .copy-btn { opacity: 1; }
        
        .agent-status {
            font-style: italic;
            color: #9ca3af;
            font-size: 0.875rem;
            margin-bottom: 0.75rem;
        }

        .tool-activity {
            border: 1px solid #4b5563;
            border-radius: 0.5rem;
            margin-top: 1rem;
            background-color: #374151;
        }
        .tool-activity-header {
            display: flex;
            align-items: center;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid #4b5563;
        }
        .tool-activity-body {
            padding: 1rem;
            font-family: monospace;
            font-size: 0.875rem;
        }
        .tool-activity-body pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .tool-activity-body .status-running { color: #facc15; }
        .tool-activity-body .status-success { color: #4ade80; }
        .tool-activity-body .status-error { color: #f87171; }

        .user-bubble {
            background-color: #1e3a8a; /* A shade of blue */
            padding: 0.75rem;
            border-radius: 0.75rem;
        }
        .bot-bubble {
            background-color: #374151; /* A darker grey */
            padding: 0.75rem;
            border-radius: 0.75rem;
        }
        #drop-zone {
            border: 2px dashed #4b5563;
            border-radius: 0.5rem;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #drop-zone.drag-over {
            background-color: #374151;
        }
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.5rem center;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }
    </style>
</head>
<body class="bg-gray-800 text-gray-200">

    <!-- Auth Screen -->
    <div id="auth-screen" class="flex items-center justify-center h-screen">
        <div class="w-full max-w-md">
            <div class="bg-gray-700 shadow-md rounded-lg px-8 pt-6 pb-8 mb-4">
                <div id="auth-tabs" class="flex mb-4 border-b border-gray-600">
                    <button class="auth-tab-btn flex-1 py-2 text-white border-b-2 border-blue-500" data-tab="login">Login</button>
                    <button class="auth-tab-btn flex-1 py-2 text-gray-400" data-tab="register">Register</button>
                </div>
                <div id="auth-error" class="text-red-400 text-center mb-4 h-6"></div>
                <form id="login-form">
                    <div class="mb-4">
                        <label class="block text-gray-300 text-sm font-bold mb-2" for="login-username">Username</label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 bg-gray-600 text-white leading-tight focus:outline-none focus:shadow-outline" id="login-username" type="text" required>
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-300 text-sm font-bold mb-2" for="login-password">Password</label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 bg-gray-600 text-white mb-3 leading-tight focus:outline-none focus:shadow-outline" id="login-password" type="password" required>
                    </div>
                    <div class="flex items-center justify-between">
                        <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">Sign In</button>
                    </div>
                </form>
                <form id="register-form" class="hidden">
                    <div class="mb-4">
                        <label class="block text-gray-300 text-sm font-bold mb-2" for="register-username">Username</label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 bg-gray-600 text-white leading-tight focus:outline-none focus:shadow-outline" id="register-username" type="text" required>
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-300 text-sm font-bold mb-2" for="register-password">Password</label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 bg-gray-600 text-white mb-3 leading-tight focus:outline-none focus:shadow-outline" id="register-password" type="password" required>
                    </div>
                    <div class="flex items-center justify-between">
                        <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">Register</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="main-app" class="hidden h-screen flex">
        <!-- Side Panel -->
        <aside id="side-panel" class="bg-gray-900 w-64 flex-shrink-0 flex flex-col transition-transform duration-300 ease-in-out absolute inset-y-0 left-0 z-30 transform -translate-x-full sm:relative sm:translate-x-0">
            <div class="p-2 flex-shrink-0">
                <button id="new-chat-btn" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded">New Chat</button>
            </div>
            <div class="flex border-b border-t border-gray-700 flex-shrink-0">
                <button id="chats-tab-btn" class="side-panel-tab flex-1 p-2 text-center font-semibold border-b-2 active">Chats</button>
                <button id="files-tab-btn" class="side-panel-tab flex-1 p-2 text-center font-semibold border-b-2 border-transparent">Files</button>
            </div>
            <div id="conversations-panel" class="flex flex-col flex-1 overflow-hidden">
                <div id="conversation-list" class="scrollable-content flex-1 p-2 overflow-y-auto"></div>
            </div>
            <div id="files-panel" class="hidden flex-col flex-1 overflow-hidden">
                 <div id="file-explorer" class="scrollable-content flex-1 p-4 overflow-y-auto"></div>
            </div>
            <div class="p-2 border-t border-gray-700 flex items-center justify-between">
                <span id="welcome-user" class="text-sm truncate"></span>
                <div>
                    <button id="settings-btn" class="p-2 text-gray-400 hover:text-white" title="Settings">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </button>
                    <button id="logout-btn" class="p-2 text-gray-400 hover:text-white" title="Logout">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </button>
                </div>
            </div>
        </aside>
        
        <!-- Overlay for mobile -->
        <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-20 hidden sm:hidden"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col relative bg-gray-800 overflow-hidden">
            <header class="bg-gray-800 border-b border-gray-700 p-4 flex items-center flex-shrink-0">
                <button id="menu-btn" class="sm:hidden mr-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex-1 text-center text-xs text-gray-400">
                    Model: <span id="current-model-display" class="font-mono text-white"></span>
                </div>
            </header>
            <main id="chat-container" class="scrollable-content flex-1 overflow-y-auto p-4 flex flex-col space-y-4">
                <div id="welcome-message" class="text-center text-gray-400 h-full flex flex-col justify-center items-center">
                    <h1 class="text-4xl font-bold">Ollama Agent</h1>
                    <p class="mt-2">Start a new conversation to begin.</p>
                </div>
            </main>
            <footer class="p-4 bg-gray-800 flex-shrink-0">
                <div class="max-w-3xl mx-auto">
                    <div class="relative flex items-center bg-gray-700 rounded-lg p-2">
                        <button id="upload-btn" class="p-2 text-gray-400 hover:text-white" title="Upload File">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                        </button>
                        <textarea id="chat-input" rows="1" class="flex-1 bg-transparent border-none focus:ring-0 text-gray-200 resize-none" placeholder="Type your message here..."></textarea>
                        <button id="send-button" class="ml-3 bg-blue-600 hover:bg-blue-700 text-white font-bold p-2 rounded-lg flex items-center justify-center w-10 h-10">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                </div>
            </footer>
        </div>
    </div>
    
    <div id="delete-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-30">
        <div class="bg-gray-800 rounded-lg p-6 shadow-xl">
            <h3 class="text-lg font-bold mb-4">Confirm Deletion</h3>
            <p id="delete-modal-text" class="mb-6"></p>
            <div class="flex justify-end space-x-4">
                <button id="cancel-delete-btn" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded">Cancel</button>
                <button id="confirm-delete-btn" class="bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-4 rounded">Delete</button>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="upload-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-30">
        <div class="bg-gray-800 rounded-lg p-6 shadow-xl w-full max-w-lg">
            <h3 class="text-lg font-bold mb-4">Upload Files and Folders</h3>
            <form id="upload-form">
                <div class="mb-4">
                    <label for="upload-prompt" class="block text-gray-300 text-sm font-bold mb-2">Prompt (optional)</label>
                    <textarea id="upload-prompt" rows="3" class="shadow appearance-none border rounded w-full py-2 px-3 bg-gray-600 text-white leading-tight focus:outline-none focus:shadow-outline" placeholder="Give the AI instructions for these files..."></textarea>
                </div>
                <div class="mb-6">
                    <div id="drop-zone">
                        <p>Drag & drop files or folders here, or click to select.</p>
                        <input type="file" id="file-input" class="hidden" multiple>
                    </div>
                    <div id="file-list" class="mt-2 text-sm text-gray-400"></div>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="cancel-upload-btn" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded">Cancel</button>
                    <button type="submit" id="confirm-upload-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded">Upload and Send</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-30">
        <div class="bg-gray-800 rounded-lg p-6 shadow-xl w-full max-w-lg">
            <h3 class="text-lg font-bold mb-4">Agent Settings</h3>
            <form id="settings-form">
                <div class="mb-4">
                    <label for="model-select" class="block text-gray-300 text-sm font-bold mb-2">Default Model</label>
                    <select id="model-select" class="shadow appearance-none border rounded w-full py-2 px-3 bg-gray-600 text-white leading-tight focus:outline-none focus:shadow-outline"></select>
                </div>
                <div class="mb-6">
                    <label for="persona-select" class="block text-gray-300 text-sm font-bold mb-2">Personality</label>
                    <select id="persona-select" class="shadow appearance-none border rounded w-full py-2 px-3 bg-gray-600 text-white leading-tight focus:outline-none focus:shadow-outline"></select>
                </div>
                <div class="flex justify-end space-x-4">
                    <button type="button" id="cancel-settings-btn" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded">Cancel</button>
                    <button type="submit" id="save-settings-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded">Save Settings</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- File Viewer Modal -->
    <div id="file-viewer-container" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-30">
        <div class="bg-gray-800 rounded-lg p-6 shadow-xl w-3/4 h-3/4 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 id="file-viewer-filename" class="text-lg font-bold"></h3>
                <button id="close-viewer-btn" class="text-white font-bold">&times;</button>
            </div>
            <div id="file-viewer" class="flex-1 bg-gray-900 p-4 rounded overflow-auto"></div>
        </div>
    </div>

    <script>
        // Global scope for elements that are always present
        const authScreen = document.getElementById('auth-screen');
        const mainApp = document.getElementById('main-app');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const authTabs = document.querySelectorAll('.auth-tab-btn');
        const authError = document.getElementById('auth-error');

        // App-specific elements, to be initialized after login
        let chatContainer, chatInput, sendButton, modelSelect, fileExplorer,
            welcomeUser, logoutBtn, deleteModal, deleteModalText, cancelDeleteBtn, confirmDeleteBtn,
            conversationList, newChatBtn, chatsTabBtn, filesTabBtn, conversationsPanel, filesPanel,
            sidePanel, menuBtn, welcomeMessage, uploadBtn, fileInput, fileViewerContainer, closeViewerBtn, overlay,
            uploadModal, uploadForm, cancelUploadBtn, dropZone, fileList, uploadPrompt,
            settingsBtn, settingsModal, settingsForm, cancelSettingsBtn, personaSelect, currentModelDisplay;

        const API_BASE = '/api';
        let conversationHistory = [];
        let currentConversationId = null;
        let deleteResolver = null;
        let userModel = null;
        
        // --- Agent State ---
        let isAgentRunning = false;
        let currentAgentBubble = null;
        let fullAgentResponse = "";

        document.addEventListener('DOMContentLoaded', async () => {
            const response = await fetch(`${window.location.origin}/check_auth`);
            if (response.ok) {
                const user = await response.json();
                initializeApp(user.username);
            } else {
                authScreen.style.display = 'flex';
                mainApp.style.display = 'none';
            }
        });

        authTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                authTabs.forEach(t => {
                    t.classList.remove('border-blue-500', 'text-white');
                    t.classList.add('text-gray-400');
                });
                tab.classList.add('border-blue-500', 'text-white');
                tab.classList.remove('text-gray-400');
                if (tab.dataset.tab === 'login') {
                    loginForm.classList.remove('hidden');
                    registerForm.classList.add('hidden');
                } else {
                    loginForm.classList.add('hidden');
                    registerForm.classList.remove('hidden');
                }
                authError.textContent = '';
            });
        });

        loginForm.addEventListener('submit', handleAuthFormSubmit);
        registerForm.addEventListener('submit', handleAuthFormSubmit);

        async function handleAuthFormSubmit(e) {
            e.preventDefault();
            const isLogin = e.target.id === 'login-form';
            const url = isLogin ? '/login' : '/register';
            const username = document.getElementById(`${isLogin ? 'login' : 'register'}-username`).value;
            const password = document.getElementById(`${isLogin ? 'login' : 'register'}-password`).value;
            
            const response = await fetch(`${window.location.origin}${url}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });
            const data = await response.json();
            if (response.ok) {
                initializeApp(data.username);
            } else {
                authError.textContent = data.message;
            }
        }

        async function initializeApp(username) {
            authScreen.style.display = 'none';
            mainApp.style.display = 'flex';

            // Initialize app-specific elements
            chatContainer = document.getElementById('chat-container');
            chatInput = document.getElementById('chat-input');
            sendButton = document.getElementById('send-button');
            modelSelect = document.getElementById('model-select');
            fileExplorer = document.getElementById('file-explorer');
            welcomeUser = document.getElementById('welcome-user');
            logoutBtn = document.getElementById('logout-btn');
            deleteModal = document.getElementById('delete-modal');
            deleteModalText = document.getElementById('delete-modal-text');
            cancelDeleteBtn = document.getElementById('cancel-delete-btn');
            confirmDeleteBtn = document.getElementById('confirm-delete-btn');
            conversationList = document.getElementById('conversation-list');
            newChatBtn = document.getElementById('new-chat-btn');
            chatsTabBtn = document.getElementById('chats-tab-btn');
            filesTabBtn = document.getElementById('files-tab-btn');
            conversationsPanel = document.getElementById('conversations-panel');
            filesPanel = document.getElementById('files-panel');
            sidePanel = document.getElementById('side-panel');
            menuBtn = document.getElementById('menu-btn');
            welcomeMessage = document.getElementById('welcome-message');
            uploadBtn = document.getElementById('upload-btn');
            fileViewerContainer = document.getElementById('file-viewer-container');
            closeViewerBtn = document.getElementById('close-viewer-btn');
            overlay = document.getElementById('overlay');
            uploadModal = document.getElementById('upload-modal');
            uploadForm = document.getElementById('upload-form');
            cancelUploadBtn = document.getElementById('cancel-upload-btn');
            dropZone = document.getElementById('drop-zone');
            fileInput = document.getElementById('file-input');
            fileList = document.getElementById('file-list');
            uploadPrompt = document.getElementById('upload-prompt');
            settingsBtn = document.getElementById('settings-btn');
            settingsModal = document.getElementById('settings-modal');
            settingsForm = document.getElementById('settings-form');
            cancelSettingsBtn = document.getElementById('cancel-settings-btn');
            personaSelect = document.getElementById('persona-select');
            currentModelDisplay = document.getElementById('current-model-display');

            welcomeUser.textContent = `Welcome, ${username}!`;

            // Attach event listeners
            logoutBtn.addEventListener('click', async () => {
                await fetch(`${window.location.origin}/logout`);
                window.location.reload();
            });
            
            newChatBtn.addEventListener('click', startNewChat);
            cancelDeleteBtn.addEventListener('click', () => deleteResolver(false));
            confirmDeleteBtn.addEventListener('click', () => deleteResolver(true));
            closeViewerBtn.addEventListener('click', () => fileViewerContainer.style.display = 'none');

            chatsTabBtn.addEventListener('click', () => switchSidePanel('chats'));
            filesTabBtn.addEventListener('click', () => switchSidePanel('files'));
            
            menuBtn.addEventListener('click', () => {
                sidePanel.classList.toggle('-translate-x-full');
                overlay.classList.toggle('hidden');
            });
            
            overlay.addEventListener('click', () => {
                 sidePanel.classList.add('-translate-x-full');
                 overlay.classList.add('hidden');
            });

            // --- Upload Modal Logic ---
            uploadBtn.addEventListener('click', () => uploadModal.classList.remove('hidden'));
            cancelUploadBtn.addEventListener('click', () => uploadModal.classList.add('hidden'));
            dropZone.addEventListener('click', () => fileInput.click());
            dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                fileInput.files = e.dataTransfer.files;
                updateFileList();
            });
            fileInput.addEventListener('change', updateFileList);
            uploadForm.addEventListener('submit', handleFileUpload);
            
            // --- Settings Modal Logic ---
            settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
            cancelSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));
            settingsForm.addEventListener('submit', handleSaveSettings);

            sendButton.addEventListener('click', () => sendMessage());
            chatInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' && !event.shiftKey) {
                    event.preventDefault();
                    sendMessage();
                }
            });
            // Auto-resize textarea
            chatInput.addEventListener('input', () => {
                chatInput.style.height = 'auto';
                chatInput.style.height = (chatInput.scrollHeight) + 'px';
            });

            await populateModels();
            await loadUserSettings();
            await populateFileExplorer();
            await populateConversations();
        }

        async function loadUserSettings() {
            try {
                const response = await fetch(`${API_BASE}/settings`);
                const settings = await response.json();
                
                // Populate Persona Dropdown
                personaSelect.innerHTML = '';
                for (const [key, name] of Object.entries(settings.available_personas)) {
                    const option = document.createElement('option');
                    option.value = key;
                    option.textContent = name;
                    personaSelect.appendChild(option);
                }
                
                userModel = settings.model || (modelSelect.options.length > 0 ? modelSelect.options[0].value : '');
                if (userModel) modelSelect.value = userModel;
                currentModelDisplay.textContent = userModel;
                personaSelect.value = settings.persona || 'default';

            } catch (error) {
                console.error("Failed to load user settings:", error);
            }
        }

        async function handleSaveSettings(e) {
            e.preventDefault();
            const newModel = modelSelect.value;
            const newPersona = personaSelect.value;
            try {
                const response = await fetch(`${API_BASE}/settings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: newModel, persona: newPersona }),
                });
                if (!response.ok) throw new Error('Failed to save settings');
                userModel = newModel;
                currentModelDisplay.textContent = userModel;
                settingsModal.classList.add('hidden');
            } catch (error) {
                alert(`Error saving settings: ${error.message}`);
            }
        }

        function switchSidePanel(tab) {
            if (tab === 'chats') {
                conversationsPanel.style.display = 'flex';
                filesPanel.style.display = 'none';
                chatsTabBtn.classList.add('active');
                filesTabBtn.classList.remove('active');
            } else {
                conversationsPanel.style.display = 'none';
                filesPanel.style.display = 'flex';
                chatsTabBtn.classList.remove('active');
                filesTabBtn.classList.add('active');
            }
        }

        async function populateModels() {
            try {
                const response = await fetch(`${window.location.origin}${API_BASE}/models`);
                if (!response.ok) throw new Error("Failed to fetch models");
                const models = await response.json();
                modelSelect.innerHTML = '';
                models.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model.name;
                    option.textContent = model.name;
                    modelSelect.appendChild(option);
                });
            } catch (error) { console.error("Failed to fetch models:", error); }
        }
        
        async function populateFileExplorer() {
            if (!currentConversationId) {
                fileExplorer.innerHTML = '<p class="text-gray-400">No active conversation. Start a new chat to see files.</p>';
                return;
            }
            try {
                const response = await fetch(`${window.location.origin}${API_BASE}/workspace/files/${currentConversationId}`);
                const files = await response.json();
                fileExplorer.innerHTML = buildFileTree(files);
                attachFileEventListeners();
            } catch (error) {
                console.error("Failed to populate file explorer:", error);
                fileExplorer.innerHTML = '<p class="text-red-400">Could not load files.</p>';
            }
        }

        function buildFileTree(nodes, pathPrefix = '') {
            if (!nodes || nodes.length === 0) return '';
            let html = '<ul class="space-y-1">';
            nodes.forEach(node => {
                const fullPath = pathPrefix ? `${pathPrefix}/${node.name}` : node.name;
                const isDir = node.type === 'directory';
                const icon = isDir ? '&#128193;' : '&#128196;';
                html += `<li class="file-item item-hover flex items-center justify-between group" data-path="${fullPath}" data-type="${node.type}">
                            <span class="flex-1 cursor-pointer hover:text-blue-400 truncate">${icon} ${node.name}</span>
                            <button class="delete-btn text-red-500 hover:text-red-400 font-bold ml-2 flex-shrink-0" title="Delete">&times;</button>
                         </li>`;
                if (isDir && node.children) {
                    html += `<li class="pl-4">${buildFileTree(node.children, fullPath)}</li>`;
                }
            });
            html += '</ul>';
            return html;
        }

        function attachFileEventListeners() {
            document.querySelectorAll('.file-item').forEach(item => {
                const path = item.dataset.path;
                const type = item.dataset.type;
                item.querySelector('span').addEventListener('click', () => {
                    if (type === 'file') alert("Viewing file content is not yet implemented.");
                });
                item.querySelector('.delete-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    confirmDeletion(path, type, 'file');
                });
            });
        }

        async function confirmDeletion(id, type, itemType) {
            deleteModalText.textContent = `Are you sure you want to delete this ${itemType}: ${id}?`;
            deleteModal.classList.remove('hidden');
            const confirmed = await new Promise(resolve => { deleteResolver = resolve; });
            if (confirmed) {
                try {
                    let url, body;
                    if (itemType === 'file') {
                        url = `${API_BASE}/workspace/file`;
                        body = { path: id, conversation_id: currentConversationId };
                    } else {
                        url = `${API_BASE}/conversation/${id}`;
                        body = {};
                    }
                    const response = await fetch(url, {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body),
                    });
                    if (!response.ok) throw new Error(await response.text());
                    
                    if (itemType === 'file') {
                        await populateFileExplorer();
                    } else {
                        await populateConversations();
                        if (id === currentConversationId) {
                            startNewChat();
                        }
                    }
                } catch (error) {
                    console.error(`Failed to delete ${id}:`, error);
                    alert(`Error deleting ${itemType}: ${error.message}`);
                }
            }
            deleteModal.classList.add('hidden');
        }

        function updateFileList() {
            if (fileInput.files.length > 0) {
                fileList.innerHTML = `${fileInput.files.length} file(s) selected.`;
            } else {
                fileList.innerHTML = '';
            }
        }

        async function handleFileUpload(event) {
            event.preventDefault();
            const files = fileInput.files;
            if (files.length === 0) {
                alert('Please select files to upload.');
                return;
            }

            const formData = new FormData();
            formData.append('prompt', uploadPrompt.value);
            formData.append('conversation_id', currentConversationId || '');

            for (let i = 0; i < files.length; i++) {
                formData.append('files[]', files[i]);
            }

            try {
                const response = await fetch(`${window.location.origin}/api/upload`, {
                    method: 'POST',
                    body: formData,
                });
                const data = await response.json();
                if (response.ok) {
                    if (!currentConversationId) {
                        currentConversationId = data.conversation_id;
                        conversationHistory = []; // Start fresh history
                    }
                    await populateFileExplorer();
                    uploadModal.classList.add('hidden');
                    uploadForm.reset();
                    updateFileList();
                    chatInput.value = data.message;
                    sendMessage();
                } else {
                    alert(`Error uploading file: ${data.error}`);
                }
            } catch (error) {
                alert(`Error uploading file: ${error.message}`);
            }
        }
        
        function setAgentRunning(isRunning) {
            isAgentRunning = isRunning;
            chatInput.disabled = isRunning;
            sendButton.disabled = isRunning;
            if (isRunning) {
                sendButton.classList.add('bg-gray-500', 'cursor-not-allowed');
                sendButton.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                sendButton.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            } else {
                sendButton.classList.remove('bg-gray-500', 'cursor-not-allowed');
                sendButton.classList.add('bg-blue-600', 'hover:bg-blue-700');
                sendButton.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"></path></svg>`;
            }
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || isAgentRunning) return;

            setAgentRunning(true);
            
            welcomeMessage.style.display = 'none';
            appendMessage(text, 'user');
            conversationHistory.push({ role: 'user', content: text });
            
            chatInput.value = '';
            chatInput.style.height = 'auto';

            currentAgentBubble = createBotMessageContainer();
            fullAgentResponse = "";
            
            const isNewConversation = !currentConversationId;

            const eventSource = new EventSource(`/api/chat?${new URLSearchParams({
                messages: JSON.stringify(conversationHistory),
                model: userModel,
                conversation_id: currentConversationId || ''
            }).toString()}`);

            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);

                    switch(data.type) {
                        case 'conversation_id':
                            if (isNewConversation) {
                                currentConversationId = data.id;
                                addConversationToList(data.id, "New Chat");
                            }
                            break;
                        case 'assistant_chunk':
                            fullAgentResponse += data.content;
                            updateBotBubble(currentAgentBubble, fullAgentResponse);
                            break;
                        case 'assistant_end':
                            // This just marks the end of a reasoning step, do nothing here
                            break;
                        case 'tool_call':
                            showToolCall(currentAgentBubble, data.name, data.params);
                            break;
                        case 'tool_result':
                            updateAgentStatus(currentAgentBubble, `Tool finished. Analyzing results...`);
                            break;
                        case 'tool_error':
                            updateAgentStatus(currentAgentBubble, `Tool Error: ${data.error}. Thinking...`, true);
                            break;
                        case 'final_answer':
                            conversationHistory.push({ role: 'assistant', content: data.content });
                            updateBotBubble(currentAgentBubble, data.content, true);
                            setAgentRunning(false);
                            eventSource.close();
                            populateConversations(); // Update title if it was a new chat
                            break;
                        case 'agent_error':
                            updateAgentStatus(currentAgentBubble, `An error occurred: ${data.error}`, true);
                            setAgentRunning(false);
                            eventSource.close();
                            break;
                    }
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                } catch (e) {
                    console.error("Error parsing SSE event data:", event.data, e);
                }
            };

            eventSource.onerror = function(err) {
                console.error("EventSource failed:", err);
                if(currentAgentBubble) updateAgentStatus(currentAgentBubble, "An error occurred. Please check the server logs.", true);
                setAgentRunning(false);
                eventSource.close();
            };
        }
        
        function createBotMessageContainer() {
            const botMessageWrapper = document.createElement('div');
            botMessageWrapper.className = 'flex max-w-3xl w-full items-start self-start mx-auto';
            
            botMessageWrapper.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gray-600 flex-shrink-0 mr-2"></div>
                <div class="flex-1 bot-bubble">
                    <div class="agent-status">Agent is thinking...</div>
                    <div class="tool-activity" style="display: none;">
                        <div class="tool-activity-header">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l-4 4-4-4 4-4"></path></svg>
                            <span class="font-semibold">Tool Call</span>
                        </div>
                        <div class="tool-activity-body">
                            <strong class="tool-name block mb-1"></strong>
                            <pre class="tool-params bg-gray-900 p-2 rounded text-xs"></pre>
                        </div>
                    </div>
                    <div class="answer-content prose prose-invert max-w-none" style="display: none;"></div>
                </div>`;
            chatContainer.appendChild(botMessageWrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return botMessageWrapper;
        }

        function updateBotBubble(bubbleElement, responseContent, isFinal = false) {
            if (!bubbleElement) return;
            const agentStatus = bubbleElement.querySelector('.agent-status');
            const toolActivity = bubbleElement.querySelector('.tool-activity');
            const answerContent = bubbleElement.querySelector('.answer-content');
            
            agentStatus.style.display = 'none';
            toolActivity.style.display = 'none';
            answerContent.style.display = 'block';

            const finalConversational = responseContent
                .replace(/<think>[\s\S]*?<\/think>/g, '')
                .replace(/```json\s*([\s\S]*?)\s*```/g, '')
                .trim();
            answerContent.innerHTML = marked.parse(finalConversational);

            if (isFinal) {
                bubbleElement.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-btn';
                    copyBtn.textContent = 'Copy';
                    copyBtn.onclick = () => {
                        navigator.clipboard.writeText(block.textContent);
                        copyBtn.textContent = 'Copied!';
                        setTimeout(() => copyBtn.textContent = 'Copy', 2000);
                    };
                    block.parentElement.appendChild(copyBtn);
                });
            }
        }

        function updateAgentStatus(bubbleElement, statusText, isError = false) {
            if (!bubbleElement) return;
            const agentStatus = bubbleElement.querySelector('.agent-status');
            const toolActivity = bubbleElement.querySelector('.tool-activity');
            const answerContent = bubbleElement.querySelector('.answer-content');
            
            agentStatus.innerHTML = statusText;
            agentStatus.style.display = 'block';
            toolActivity.style.display = 'none';
            answerContent.style.display = 'none';
            
            agentStatus.classList.toggle('text-red-400', isError);
        }

        function showToolCall(bubbleElement, toolName, toolParams) {
            if (!bubbleElement) return;
            const agentStatus = bubbleElement.querySelector('.agent-status');
            const toolActivity = bubbleElement.querySelector('.tool-activity');
            const answerContent = bubbleElement.querySelector('.answer-content');
            const toolNameEl = toolActivity.querySelector('.tool-name');
            const toolParamsEl = toolActivity.querySelector('.tool-params');

            agentStatus.style.display = 'none';
            answerContent.style.display = 'none';
            toolActivity.style.display = 'block';

            toolNameEl.textContent = toolName;
            toolParamsEl.textContent = JSON.stringify(toolParams, null, 2);
        }

        async function populateConversations() {
            try {
                const response = await fetch(`${window.location.origin}${API_BASE}/conversations`);
                const convos = await response.json();
                conversationList.innerHTML = '';
                convos.forEach(convo => {
                    const item = document.createElement('div');
                    const isActive = convo.id === currentConversationId;
                    item.className = `conversation-item item-hover group flex justify-between items-center p-2 rounded-md cursor-pointer hover:bg-gray-700 ${isActive ? 'active' : ''}`;
                    item.dataset.id = convo.id;
                    item.innerHTML = `<span class="truncate flex-1">${convo.title}</span>
                                      <button class="delete-btn text-red-500 hover:text-red-400 font-bold ml-2">&times;</button>`;
                    item.addEventListener('click', () => {
                        if (!isActive && !isAgentRunning) loadConversation(convo.id);
                    });
                    item.querySelector('.delete-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        confirmDeletion(convo.id, 'conversation', 'conversation');
                    });
                    conversationList.appendChild(item);
                });
            } catch (error) {
                console.error("Failed to populate conversations:", error);
            }
        }

        async function loadConversation(id) {
            try {
                const response = await fetch(`${window.location.origin}${API_BASE}/conversation/${id}`);
                const data = await response.json();
                currentConversationId = id;
                chatContainer.innerHTML = '';
                welcomeMessage.style.display = 'none';
                
                conversationHistory = data.messages || [];
                // Re-render history
                conversationHistory.forEach(msg => {
                    if (msg.role === 'user') {
                        appendMessage(msg.content, 'user');
                    } else if (msg.role === 'assistant') {
                        const botBubble = createBotMessageContainer();
                        updateBotBubble(botBubble, msg.content, true);
                    }
                });

                chatContainer.scrollTop = chatContainer.scrollHeight;
                await populateFileExplorer();
                await populateConversations();
            } catch (error) {
                console.error("Error loading conversation:", error);
            }
        }

        function startNewChat() {
            if (isAgentRunning) return;
            currentConversationId = null;
            conversationHistory = [];
            chatContainer.innerHTML = '';
            welcomeMessage.style.display = 'flex';
            populateFileExplorer();
            populateConversations();
        }

        function appendMessage(text, sender) {
            const messageWrapper = document.createElement('div');
            messageWrapper.className = `flex max-w-3xl w-full items-start self-${sender === 'user' ? 'end' : 'start'} mx-auto`;

            if (sender === 'user') {
                messageWrapper.innerHTML = `
                    <div class="flex-1 user-bubble">
                        <div class="prose prose-invert max-w-none">${marked.parse(text)}</div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-blue-800 flex-shrink-0 ml-2"></div>`;
            } 

            chatContainer.appendChild(messageWrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

    </script>
</body>
</html>
